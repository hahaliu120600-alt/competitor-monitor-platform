{% extends "base.html" %}

{% block title %}历史报告 - 竞品监测平台{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">
                    <i class="bi bi-file-earmark-text"></i> 历史周报
                </h5>
                <button class="btn btn-primary btn-sm" onclick="generateReport()">
                    <i class="bi bi-plus-circle"></i> 生成新周报
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>报告名称</th>
                                <th>文件大小</th>
                                <th>生成时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="reports-tbody">
                            <tr>
                                <td colspan="4" class="text-center">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">加载中...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    loadReports();
});

async function loadReports() {
    try {
        const response = await axios.get('/api/reports/list');
        if (response.data.success) {
            const reports = response.data.data;
            renderReports(reports);
        }
    } catch (error) {
        console.error('加载报告列表失败:', error);
        document.getElementById('reports-tbody').innerHTML =
            '<tr><td colspan="4" class="text-danger text-center">加载失败，请刷新重试</td></tr>';
    }
}

function renderReports(reports) {
    const tbody = document.getElementById('reports-tbody');

    if (reports.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">暂无报告</td></tr>';
        return;
    }

    let html = '';
    reports.forEach(report => {
        const sizeKB = (report.size / 1024).toFixed(2);

        html += `
            <tr>
                <td><i class="bi bi-file-text"></i> ${report.filename}</td>
                <td>${sizeKB} KB</td>
                <td>${report.created_at}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" onclick="openReport('${report.path}')">
                        <i class="bi bi-eye"></i> 查看
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="downloadReport('${report.path}')">
                        <i class="bi bi-download"></i> 下载
                    </button>
                </td>
            </tr>
        `;
    });

    tbody.innerHTML = html;
}

function openReport(path) {
    // 在新窗口中打开报告目录
    const dirPath = path.substring(0, path.lastIndexOf('/'));
    alert('报告路径：' + path + '\n\n请在Finder中打开查看');
}

function downloadReport(path) {
    alert('报告已保存在：' + path);
}

async function generateReport() {
    if (!confirm('确定要生成新的周报吗？')) {
        return;
    }

    try {
        const response = await axios.post('/api/reports/generate');
        if (response.data.success) {
            alert('周报生成成功！\n路径: ' + response.data.path);
            loadReports(); // 重新加载列表
        }
    } catch (error) {
        alert('生成周报失败: ' + error.message);
    }
}
</script>
{% endblock %}
